    #URL is optional
    git_url: "https://github.com/Sara-Ho99/master-mind"
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Developed and maintained a web application for educational content creators using Next.js and TypeScript, and created reusable UI components to enhance consistency and maintainability. Designed and optimized PostgreSQL databases using Prisma ORM for seamless and efficient data interactions. Implemented security best practices, including role-based access control, and integrated secure authentication with Clerk. Deployed the application on Vercel, ensuring fast load times and global availability.
