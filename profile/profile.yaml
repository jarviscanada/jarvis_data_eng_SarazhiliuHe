    description: "Collaborated within an Agile team to deliver diverse software development projects across multiple sprints. Developed backend tools and automation scripts using Linux/Bash, SQL, Java, and Python to support data processing and system maintenance tasks. Worked with Google Cloud Platform (GCP) to provision virtual machines and access company infrastructure via remote desktop. Used Git for version control and Docker for containerization to build, test, and maintain scalable applications."
  - title: "Full Stack Software Developer"
    company: "Skill4Skill"
    duration: "MAR 2025-present"
    description: "Collaborated with cross-functional teams to develop Skill4Skill, a web platform where individuals can exchange expertise. Built a responsive and accessible frontend in Next.js, ensuring alignment with design specifications and style guides, and worked closely with designers to refine UI/UX. Designed MongoDB schemas and developed RESTful APIs with Express.js, and integrated backend APIs with frontend components for seamless feature delivery. Maintained documentation for codebases, workflows, and API specifications. Participated in Agile development using Jira for sprint planning, user story tracking, and backlog management."
  - title: "Research Assistant"
    company: "University of Waterloo"
    duration: "MAY 2024-DEC 2024"
    description: "Researched and developed mathematical optimization models to improve multi-echelon supply chain performance, focusing on minimizing costs and improving inventory allocation efficiency. Applied Python, Pandas, NumPy, and Gurobi to build and test mixed-integer linear programming (MILP) models simulating real-world supply chain scenarios. Drafted detailed analytical reports summarizing methodology, results, and analyses. Collaborated closely with the supervising professor to iteratively refine the research paper."

