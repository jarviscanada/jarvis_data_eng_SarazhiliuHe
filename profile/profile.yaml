# List of Jarvis projects
jarvis_projects:
  - name: "Linux Cluster Monitoring Agent"
    git_url: "/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Built the Jarvis Linux Cluster Monitoring Agent to assist the Linux Cluster Administration (LCA) team in managing a multi-node Rocky Linux environment. Implemented a Bash Script to collect static system information, such as CPU architecture, memory, and disk specs, executed once on each node. Automated the collection of real-time resource usage data, such as CPU, memory, and disk usage, using a Bash script triggered by a Cron job every minute. Deployed a PostgreSQL database in a Docker container to store the collected data in a portable environment. Used Git and GitHub for source code management and version control.
  - name: "Java Grep App"
    git_url: "/core_java"
    description: "Developed Grep App, a Java application that mimics the Linux grep command to search for lines matching a regular expression across a directory of text files. Leveraged Java 8 Lambda and Stream APIs for efficient and readable data processing. Utilized Maven for project build and dependency management. Dockerized the application for seamless distribution and deployment."
