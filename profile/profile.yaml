  - name: "Python Data Analytics"
    git_url: "/python_data_anlytics"
    description: "Developed a Proof of Concept (PoC) data analysis project for LGS, a retail company, to help the marketing team optimize campaign strategies. Designed and provisioned a local PostgreSQL OLAP data warehouse using Docker to ingest and organize raw retail data. Performed in-depth sales performance and customer behavior analysis using Python (Pandas, NumPy) in Jupyter Notebook, identifying key purchasing patterns and trends. Delivered insights and visualizations via GitHub to support data-driven decision-making."
#  - name: "Hadoop"
#    git_url: "/hadoop"
