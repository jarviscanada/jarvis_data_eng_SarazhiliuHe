    git_url:
    description: Built a responsive warehouse inventory management website using HTML, CSS, React, and JavaScript, adhering to functional and visual design requirements. Developed and managed APIs with Node.js, Express.js, and Knex.js, optimizing database interactions with MySQL. Handled version control and team collaboration using Git and GitHub, utilized Jira for project management, and participated in code reviews to ensure high-quality development and on-time delivery.

